<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Client Community Holiday Recipe Book</title>
<meta name="description" content="Favorite holiday recipes shared by our client community.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a; --ink:#1d1b18; --gold:#B19A55; --gold-soft:#cdb87e;
    --ivory:#F7F5F1; --paper:#fffcf6; --paper-edge:#efe7d8;
    --cranberry:#8E1B2C; --evergreen:#2F4A3A; --muted:#6d675e; --line:#e6dfd2;
    --page-h:min(84vh, 820px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at top,#2a2622 0%,#121110 60%,#0a0a0a 100%);
    color:var(--ink); font-family:'Jost',sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  button{font-family:inherit;}

  /* ---------- Top bar ---------- */
  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px;color:var(--ivory);max-width:1180px;margin:0 auto;
  }
  .bar .title{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-soft);text-align:center;flex:1;}
  .chip{
    background:transparent;border:1px solid rgba(205,184,126,.45);color:var(--ivory);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;cursor:pointer;white-space:nowrap;
  }
  .chip:hover{background:rgba(205,184,126,.15);}

  /* ---------- Book stage ---------- */
  .stage{display:flex;justify-content:center;align-items:flex-start;padding:4px 16px 0;perspective:2200px;}
  .book{position:relative;display:flex;width:100%;max-width:520px;}
  .book.spread{max-width:1100px;}
  .book.spread.solo{max-width:550px;}
  .book.spread:not(.solo)::after{
    content:"";position:absolute;top:0;bottom:0;left:50%;width:40px;transform:translateX(-50%);
    background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.16) 45%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.16) 55%,rgba(0,0,0,0) 100%);
    pointer-events:none;z-index:3;
  }
  .page{
    display:none;position:relative;flex:1 1 0;min-width:0;
    background:var(--paper);
    background-image:radial-gradient(rgba(177,154,85,.05) 1px,transparent 1px);
    background-size:6px 6px;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.8), inset 0 0 0 1px var(--paper-edge);
    padding:34px 30px 54px;
    min-height:calc(100vh - 150px);
  }
  .page.show{display:block;}
  .book.spread .page{height:var(--page-h);min-height:0;overflow-y:auto;scrollbar-width:thin;}
  .book.spread .page.left{box-shadow:-18px 30px 60px -30px rgba(0,0,0,.8), inset -10px 0 18px -14px rgba(0,0,0,.25), inset 0 0 0 1px var(--paper-edge);}
  .book.spread .page.right{box-shadow:18px 30px 60px -30px rgba(0,0,0,.8), inset 10px 0 18px -14px rgba(0,0,0,.25), inset 0 0 0 1px var(--paper-edge);}

  .page.turn-next{animation:turnNext .55s cubic-bezier(.2,.7,.3,1) both;transform-origin:left center;}
  .page.turn-prev{animation:turnPrev .55s cubic-bezier(.2,.7,.3,1) both;transform-origin:right center;}
  @keyframes turnNext{from{transform:rotateY(-28deg);opacity:0;}to{transform:none;opacity:1;}}
  @keyframes turnPrev{from{transform:rotateY(28deg);opacity:0;}to{transform:none;opacity:1;}}
  @media (prefers-reduced-motion:reduce){.page.turn-next,.page.turn-prev{animation:none;}}

  .folio{
    position:absolute;bottom:18px;left:0;right:0;text-align:center;
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--muted);
  }
  .running{
    font-family:'Cinzel',serif;font-size:10px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--gold);text-align:center;margin-bottom:22px;
  }

  /* ---------- Cover / back cover ---------- */
  .page.cover{
    background:var(--black);color:var(--ivory);text-align:center;
    display:none;padding:56px 34px;
    background-image:radial-gradient(circle at 50% 0%,rgba(177,154,85,.18),transparent 60%);
    box-shadow:0 30px 60px -30px rgba(0,0,0,.9), inset 0 0 0 1px #222;
  }
  .page.cover.show{display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover .frame{position:absolute;inset:16px;border:1px solid rgba(177,154,85,.45);pointer-events:none;}
  .cover .frame::after{content:"";position:absolute;inset:6px;border:1px solid rgba(177,154,85,.18);}
  .cover .logo{width:118px;margin:0 auto 26px;}
  .cover .sprig{width:120px;margin:0 auto 18px;}
  .eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;}
  .cover h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,7vw,60px);line-height:1.04;margin:14px 0 10px;}
  .cover h1 em{color:var(--gold-soft);}
  .cover .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:rgba(247,245,241,.75);max-width:360px;}
  .cover .vol{
    margin-top:28px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;
    border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:8px 16px;color:var(--gold-soft);
  }
  .cover .open-hint{margin-top:30px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,245,241,.5);}
  .cover .hosts{margin-top:18px;font-size:12px;letter-spacing:.08em;color:rgba(247,245,241,.6);}

  /* ---------- Letter ---------- */
  .letter h2,.contents h2,.page h2.sec{
    font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1.1;text-align:center;margin-bottom:6px;
  }
  .orn{width:70px;height:1px;background:var(--gold);margin:14px auto 24px;}
  .letter p{font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.6;margin-bottom:14px;}
  .letter p:first-of-type::first-letter{
    float:left;font-family:'Cinzel',serif;font-size:58px;line-height:.9;padding:6px 8px 0 0;color:var(--cranberry);
  }
  .letter .sig{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--evergreen);margin-top:18px;text-align:right;}

  /* ---------- Contents ---------- */
  .toc-group{margin-bottom:20px;}
  .toc-group h3{font-family:'Cinzel',serif;font-weight:500;font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:6px;}
  .toc-row{
    display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;cursor:pointer;text-align:left;
    padding:7px 0;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--ink);
  }
  .toc-row .dots{flex:1;border-bottom:1px dotted #bdb3a2;transform:translateY(-5px);}
  .toc-group .by{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;color:var(--muted);}
  .toc-row:hover .t{color:var(--cranberry);}

  /* ---------- Recipe page ---------- */
  .ribbon{
    position:absolute;top:0;right:26px;width:44px;padding:12px 0 18px;text-align:center;
    color:#fff;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    writing-mode:vertical-rl;clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);
  }
  .rhead{display:flex;gap:18px;align-items:center;margin:4px 56px 18px 0;}
  .badge{width:86px;height:86px;flex:0 0 86px;border-radius:50%;display:grid;place-items:center;}
  .badge svg{width:56px;height:56px;}
  .rhead h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(28px,4.4vw,36px);line-height:1.08;}
  .rhead .fam{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--muted);margin-top:2px;}
  .note{
    margin:0 0 20px;padding:12px 16px;border-left:3px solid var(--gold);background:rgba(177,154,85,.08);
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:1.5;
  }
  .rcols{display:grid;grid-template-columns:1fr;gap:20px;}
  .page h4{font-family:'Cinzel',serif;font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:8px;}
  .ing{list-style:none;}
  .ing li{border-bottom:1px dashed var(--line);}
  .ing label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;font-size:15px;}
  .ing input{
    appearance:none;-webkit-appearance:none;width:18px;height:18px;flex:0 0 18px;border:1.5px solid var(--gold);
    border-radius:4px;margin-top:3px;display:grid;place-items:center;cursor:pointer;background:#fff;
  }
  .ing input:checked{background:var(--gold);}
  .ing input:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
  .ing input:checked + span{text-decoration:line-through;color:var(--muted);}
  .steps{list-style:none;counter-reset:s;}
  .steps li{counter-increment:s;position:relative;padding:0 0 12px 38px;font-size:15px;}
  .steps li::before{
    content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;
    background:var(--black);color:var(--gold-soft);font-family:'Cinzel',serif;font-size:12px;display:grid;place-items:center;
  }
  .tip{font-size:14px;background:rgba(47,74,58,.08);padding:10px 14px;margin-top:4px;}
  .tip strong{font-weight:600;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}

  /* ---------- Bonus + share ---------- */
  .bonus ol{padding-left:20px;margin-top:6px;}
  .bonus li{margin-bottom:8px;font-size:15.5px;}
  .bonus .art{width:120px;margin:0 auto 10px;}
  .warn{font-size:13px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .share{text-align:center;}
  .share p{font-family:'Cormorant Garamond',serif;font-size:20px;max-width:380px;margin:0 auto 22px;}
  .btn{
    display:inline-block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:12px 18px;
    background:var(--gold);color:var(--black);border:1px solid var(--gold);text-decoration:none;cursor:pointer;
  }
  .btn:hover{background:var(--black);color:var(--gold-soft);border-color:var(--black);}
  .lined{margin:26px auto 0;max-width:340px;}
  .lined div{border-bottom:1px solid #d9cfbd;height:34px;}

  /* ---------- Controls ---------- */
  .controls{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px 16px 22px;color:var(--ivory);}
  .arrow{
    width:46px;height:46px;border-radius:50%;border:1px solid rgba(205,184,126,.5);background:transparent;
    color:var(--gold-soft);font-size:20px;cursor:pointer;display:grid;place-items:center;
  }
  .arrow:hover:not(:disabled){background:rgba(205,184,126,.15);}
  .arrow:disabled{opacity:.25;cursor:default;}
  .pager{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;min-width:110px;text-align:center;color:rgba(247,245,241,.8);}
  .swipe-tip{text-align:center;color:rgba(247,245,241,.45);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding-bottom:20px;}

  /* ---------- Library ---------- */
  .library{display:none;max-width:1000px;margin:0 auto;padding:10px 16px 40px;color:var(--ivory);text-align:center;}
  .library.show{display:block;}
  .library h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,6vw,48px);margin:10px 0 4px;}
  .library .lede{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:rgba(247,245,241,.7);}
  .shelf{
    display:flex;flex-wrap:wrap;justify-content:center;gap:34px;margin:40px 0 0;padding:0 10px 22px;
    border-bottom:14px solid #3b2d22;box-shadow:0 18px 22px -16px rgba(0,0,0,.9);
  }
  .vol-book{
    width:170px;height:240px;position:relative;cursor:pointer;border:0;
    background:var(--black);color:var(--ivory);text-align:center;padding:26px 14px 14px 22px;
    box-shadow:6px 8px 18px rgba(0,0,0,.6), inset 8px 0 0 rgba(255,255,255,.06), inset 10px 0 0 rgba(0,0,0,.4);
    transition:transform .25s;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  }
  .vol-book:hover{transform:translateY(-8px) rotate(-1deg);}
  .vol-book .band{position:absolute;left:0;top:0;bottom:0;width:12px;}
  .vol-book .y{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:var(--gold);}
  .vol-book .n{font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1.05;}
  .vol-book .n em{color:var(--gold-soft);display:block;font-size:20px;}
  .vol-book .c{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(247,245,241,.55);}
  .vol-book.next{
    background:transparent;border:1px dashed rgba(205,184,126,.5);box-shadow:none;cursor:default;
  }
  .vol-book.next:hover{transform:none;}
  .vol-book.next .n{color:rgba(247,245,241,.7);}
  .lib-foot{margin-top:28px;font-size:12px;color:rgba(247,245,241,.55);}
  .lib-foot a{color:var(--gold-soft);}

  footer.site{text-align:center;color:rgba(247,245,241,.45);font-size:11px;letter-spacing:.08em;padding:0 16px 26px;}
  footer.site img{width:90px;margin:0 auto 8px;opacity:.85;}

  @media (max-width:640px){
    .bar{padding:10px 12px;gap:8px;}
    .bar .title{font-size:9px;letter-spacing:.14em;}
    .chip{padding:7px 9px;font-size:10px;letter-spacing:.1em;}
    #printBtn{display:none;}
    .page{padding:30px 20px 54px;}
    .rhead{gap:14px;margin-right:46px;}
    .badge{width:64px;height:64px;flex-basis:64px;}
    .badge svg{width:42px;height:42px;}
    .ribbon{right:16px;width:36px;}
    .letter p{font-size:18px;}
    .shelf{gap:20px;}
    .vol-book{width:140px;height:200px;}
  }
  @media (min-width:900px){ .rcols{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:26px;} .book.spread .rcols{grid-template-columns:1fr;} }

  @media print{
    @page{size:5.5in 8.5in;margin:0;}
    body{background:#fff;}
    .bar,.controls,.swipe-tip,.library,footer.site,.hint{display:none !important;}
    .stage{display:block;padding:0;perspective:none;}
    .book,.book.spread{display:block;max-width:none;}
    .book.spread::after{display:none;}
    .page,.page.cover{display:block !important;height:auto !important;min-height:8.5in;overflow:visible !important;
      box-shadow:none !important;page-break-after:always;break-after:page;animation:none !important;}
    .page.cover{display:flex !important;flex-direction:column;justify-content:center;align-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .ribbon,.badge,.steps li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<div class="bar">
  <button class="chip" id="libBtn" type="button">&#9776; Library</button>
  <div class="title" id="barTitle">Holiday Recipe Book</div>
  <button class="chip" id="printBtn" type="button">Print</button>
</div>

<section class="library" id="library" aria-label="All volumes">
  <div class="eyebrow">The Collection</div>
  <h2>Client Community Recipe Library</h2>
  <p class="lede">One volume for every Holiday Kickoff</p>
  <div class="shelf" id="shelf"></div>
  <p class="lib-foot" id="libFoot"></p>
</section>

<div id="reader">
  <div class="stage"><div class="book" id="book"></div></div>
  <div class="controls">
    <button class="arrow" id="prev" type="button" aria-label="Previous page">&#8249;</button>
    <div class="pager" id="pager"></div>
    <button class="arrow" id="next" type="button" aria-label="Next page">&#8250;</button>
  </div>
  <div class="swipe-tip" id="swipeTip">Swipe or tap the arrows to turn the page</div>
</div>

<footer class="site">
  <img src="exp-realty-logo-white.png" alt="eXp Realty">
  <span id="footHosts"></span><br>Recipes shared by clients for personal, non-commercial use.
</footer>

<script src="recipes.js"></script>

  };
  var SPRIG = '<svg class="sprig" viewBox="0 0 120 60" aria-hidden="true"><g fill="none" stroke="#B19A55" stroke-width="1.4" stroke-linecap="round"><path d="M8 44 C38 30, 82 30, 112 44"/><path d="M28 38 l-8 -10 M28 38 l-10 2 M46 34 l-6 -11 M46 34 l-11 -1 M74 34 l6 -11 M74 34 l11 -1 M92 38 l8 -10 M92 38 l10 2"/></g><circle cx="56" cy="42" r="4.5" fill="#8E1B2C"/><circle cx="64" cy="44" r="4.5" fill="#8E1B2C"/><circle cx="60" cy="36" r="4.5" fill="#a8293c"/></svg>';
  var POT = '<svg class="art" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="52" fill="none" stroke="#B19A55" stroke-width="1.2"/><circle cx="42" cy="60" r="14" fill="#E8913A"/><circle cx="42" cy="60" r="9" fill="none" stroke="#f7d29a" stroke-width="1.4"/><g fill="#a8293c"><circle cx="66" cy="66" r="5"/><circle cx="74" cy="58" r="5"/><circle cx="64" cy="54" r="4.5"/></g><rect x="56" y="34" width="26" height="6" rx="3" fill="#8b5a2b" transform="rotate(-24 69 37)"/><path d="M30 34 q10 -12 22 -6 M36 30 l-4 -6 M44 27 l0 -7" stroke="#2F4A3A" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}

  var vol, pages, idx = 0, spread = false;
  var book = document.getElementById("book");

  function sortedRecipes(v){
    return v.recipes.slice().sort(function(a,b){
      var d = CAT_ORDER.indexOf(a.category) - CAT_ORDER.indexOf(b.category);
      return d !== 0 ? d : 0;
    });
  }

  function buildPages(v){
    var p = [], recipes = sortedRecipes(v);
    var run = '<div class="running">Volume ' + esc(v.number) + ' &middot; ' + v.year + '</div>';

    p.push({cls:"cover", html:
      '<div class="frame"></div><img class="logo" src="exp-realty-logo-white.png" alt="eXp Realty">' + SPRIG +
      '<div class="eyebrow">' + esc(v.event) + '</div>' +
      '<h1>The Client Community <em>' + esc(v.title) + '</em></h1>' +
      '<div class="sub">Favorite dishes, shared by the people who make a house feel like home</div>' +
      '<div class="vol">Volume ' + esc(v.number) + ' &middot; ' + v.year + '</div>' +
      '<div class="open-hint">Turn the page &#8250;</div>'});

    p.push({cls:"letter", html: run +
      '<h2>A Note Before You Cook</h2><div class="orn"></div>' +
      v.letter.map(function(t){return '<p>' + esc(t) + '</p>';}).join("") +
      '<p class="sig">With gratitude, ' + esc(DATA.signoff) + '</p>'});

    var firstRecipePage = 3;
    var toc = run + '<h2>Contents</h2><div class="orn"></div>';
    var groups = {};
    recipes.forEach(function(r,i){ (groups[r.category] = groups[r.category] || []).push({r:r, page:firstRecipePage + i}); });
    CAT_ORDER.forEach(function(c){
      if(!groups[c]) return;
      toc += '<div class="toc-group"><h3 style="color:' + CAT[c].color + '">' + CAT[c].plural + '</h3>';
      groups[c].forEach(function(g){
        toc += '<button class="toc-row" data-go="' + g.page + '"><span class="t">' + esc(g.r.title) + '</span><span class="dots"></span><span>' + g.page + '</span></button>' +
               '<div class="by" style="margin:-6px 0 4px">' + esc(g.r.family) + '</div>';
      });
      toc += '</div>';
    });
    var bonusPage = firstRecipePage + recipes.length;
    toc += '<div class="toc-group"><h3 style="color:var(--gold)">Extras</h3>' +
      '<button class="toc-row" data-go="' + bonusPage + '"><span class="t">Your Holiday Simmer Pot</span><span class="dots"></span><span>' + bonusPage + '</span></button>' +
      '<button class="toc-row" data-go="' + (bonusPage + 1) + '"><span class="t">Add Your Recipe</span><span class="dots"></span><span>' + (bonusPage + 1) + '</span></button></div>';
    p.push({cls:"contents", html: toc});

    recipes.forEach(function(r){
      var c = CAT[r.category] || CAT.Main;
      var h = run +
        '<div class="ribbon" style="background:' + c.color + '">' + esc(r.category) + '</div>' +
        '<div class="rhead"><div class="badge" style="background:' + c.tint + '">' + (ICON[r.category] || ICON.Main) + '</div>' +
        '<div><h2>' + esc(r.title) + '</h2><div class="fam">Shared by the ' + esc(r.family) + '</div></div></div>' +
        (r.note ? '<p class="note">' + esc(r.note) + '</p>' : '') +
        '<div class="rcols"><div><h4 style="color:' + c.color + '">Ingredients</h4><ul class="ing">' +
        r.ingredients.map(function(t,i){
          var key = 'rb-' + v.id + '-' + r.id + '-' + i;
          return '<li><label><input type="checkbox" data-key="' + key + '"' + (store(key) === '1' ? ' checked' : '') + '><span>' + esc(t) + '</span></label></li>';
        }).join("") +
        '</ul><p class="hint">Tap to check off as you shop.</p></div>' +
        '<div><h4 style="color:' + c.color + '">Directions</h4><ol class="steps">' +
        r.steps.map(function(t){return '<li>' + esc(t) + '</li>';}).join("") + '</ol>' +
        (r.tip ? '<p class="tip"><strong>Tip:</strong> ' + esc(r.tip) + '</p>' : '') +
        '</div></div>';
      p.push({cls:"recipe", html:h});
    });

    p.push({cls:"bonus", html: run + POT +
      '<h2 class="sec">Your Holiday Simmer Pot</h2><div class="orn"></div>' +
      '<p style="text-align:center;font-family:\'Cormorant Garamond\',serif;font-style:italic;font-size:18px;">From your gift bag</p>' +
      '<ol><li>Empty your kit into a medium saucepan and cover with a few inches of water.</li>' +
      '<li>Bring it to a gentle boil, then turn the heat down to the lowest simmer.</li>' +
      '<li>Add water every 30 minutes or so to keep everything covered.</li>' +
      '<li>Turn it off when you leave the room. Cooled contents keep in the fridge for a day or two of reuse.</li></ol>' +
      '<p class="warn">Never leave a simmer pot unattended on the stove, and keep it out of reach of kids and pets. The contents are for scent only, not for eating.</p>'});

    p.push({cls:"share", html: run +
      '<h2 class="sec">Add Your Recipe</h2><div class="orn"></div>' +
      '<p>Have a favorite we are missing? Send us the dish everyone asks you to bring, plus a line about why it matters to your family, and we will add it to the book.</p>' +
      '<a class="btn" href="mailto:' + DATA.submitEmail + '?subject=' + encodeURIComponent('Recipe for the Holiday Recipe Book') + '">Email your recipe</a>' +
      '<div class="lined"><div></div><div></div><div></div><div></div></div>' +
      '<p style="font-size:15px;margin-top:10px;font-style:italic;color:var(--muted)">Room for your notes</p>'});

    p.push({cls:"cover back", html:
      '<div class="frame"></div>' + SPRIG +
      '<div class="eyebrow">With Gratitude</div>' +
      '<h1 style="font-size:clamp(30px,5vw,42px)">Thank you for <em>sharing your table</em></h1>' +
      '<div class="sub">From our kitchens to yours, happy holidays.</div>' +
      '<img class="logo" style="margin-top:34px" src="exp-realty-logo-white.png" alt="eXp Realty">' +
      '<div class="hosts">' + esc(DATA.hosts) + ', REALTORS&reg; &middot; ' + esc(DATA.brokerage) + '</div>'});
    return p;
  }

  function renderBook(){
    book.innerHTML = pages.map(function(pg,i){
      var folio = (i > 0 && i < pages.length - 1) ? '<div class="folio">' + i + '</div>' : '';
      return '<article class="page ' + pg.cls + '" data-i="' + i + '">' + pg.html + folio + '</article>';
    }).join("");
    book.querySelectorAll(".toc-row").forEach(function(b){
      b.addEventListener("click",function(){ go(parseInt(b.getAttribute("data-go"),10)); });
    });
    book.querySelectorAll(".ing input").forEach(function(cb){
      cb.addEventListener("change",function(){ store(cb.getAttribute("data-key"), cb.checked ? '1' : '0'); });
    });
  }

  function visible(i){
    if(!spread) return [i];
    var last = pages.length - 1;
    if(i === 0) return [0];
    if(i === last) return [last];
    var l = (i % 2 === 1) ? i : i - 1;
    return (l + 1 < last) ? [l, l + 1] : [l];
  }

  function show(dir){
    var vis = visible(idx);
    book.classList.toggle("spread", spread);
    book.classList.toggle("solo", spread && vis.length === 1);
    book.querySelectorAll(".page").forEach(function(el){
      var i = parseInt(el.getAttribute("data-i"),10), on = vis.indexOf(i) > -1;
      el.classList.remove("show","left","right","turn-next","turn-prev");
      if(on){
        el.classList.add("show");
        if(vis.length === 2) el.classList.add(i === vis[0] ? "left" : "right");
        if(dir) { void el.offsetWidth; el.classList.add(dir > 0 ? "turn-next" : "turn-prev"); }
        el.scrollTop = 0;
      }
    });
    var first = vis[0], lastV = vis[vis.length - 1];
    document.getElementById("prev").disabled = first === 0;
    document.getElementById("next").disabled = lastV === pages.length - 1;
    var label;
    if(first === 0) label = "Cover";
    else if(lastV === pages.length - 1 && vis.length === 1) label = "Back cover";
    else label = vis.length === 2 ? "Pages " + first + " & " + lastV : "Page " + first;
    document.getElementById("pager").textContent = /cover/i.test(label) ? label : label + " of " + (pages.length - 2);
    try{ history.replaceState(null, "", "#" + vol.id + "/" + first); }catch(e){}
    if(dir) window.scrollTo({top:0, behavior:"smooth"});
  }

  function go(i, dir){
    i = Math.max(0, Math.min(pages.length - 1, i));
    var d = dir || (i > idx ? 1 : -1);
    idx = i; show(d);
  }
  function step(d){
    var vis = visible(idx);
    var target = d > 0 ? vis[vis.length - 1] + 1 : vis[0] - 1;
    if(target < 0 || target > pages.length - 1) return;
    go(target, d);
  }

  function openVolume(id, page){
    vol = DATA.volumes.filter(function(v){return v.id === String(id);})[0] || DATA.volumes[0];
    pages = buildPages(vol);
    document.getElementById("barTitle").textContent = "Volume " + vol.number + " · " + vol.year;
    document.title = "Holiday Recipe Book, Volume " + vol.number + " (" + vol.year + ")";
    renderBook();
    document.getElementById("library").classList.remove("show");
    document.getElementById("reader").style.display = "";
    idx = page || 0; show(0);
  }

  function openLibrary(){
    var shelf = document.getElementById("shelf");
    shelf.innerHTML = DATA.volumes.map(function(v){
      return '<button class="vol-book" type="button" data-vol="' + v.id + '"><span class="band" style="background:' + (v.color || '#8E1B2C') + '"></span>' +
        '<span class="y">' + v.year + '</span><span class="n">Volume<em>' + esc(v.number) + '</em></span>' +
        '<span class="c">' + v.recipes.length + ' recipe' + (v.recipes.length === 1 ? '' : 's') + '</span></button>';
    }).join("") +
      '<div class="vol-book next"><span class="y">' + (DATA.volumes[0].year + 1) + '</span><span class="n">Next Volume<em>Save your favorites</em></span><span class="c">Coming soon</span></div>';
    shelf.querySelectorAll("[data-vol]").forEach(function(b){
      b.addEventListener("click",function(){ openVolume(b.getAttribute("data-vol"), 0); });
    });
    document.getElementById("libFoot").innerHTML = 'Have a recipe for the next volume? <a href="mailto:' + DATA.submitEmail + '?subject=' + encodeURIComponent('Recipe for the next Holiday Recipe Book') + '">Send it anytime</a>.';
    document.getElementById("reader").style.display = "none";
    document.getElementById("library").classList.add("show");
    document.getElementById("barTitle").textContent = "Recipe Library";
    try{ history.replaceState(null, "", "#library"); }catch(e){}
  }

  function setLayout(){
    var was = spread;
    spread = window.innerWidth >= 1000;
    if(pages && was !== spread) show(0);
  }

  document.getElementById("prev").addEventListener("click",function(){ step(-1); });
  document.getElementById("next").addEventListener("click",function(){ step(1); });
  document.getElementById("libBtn").addEventListener("click",function(){
    if(document.getElementById("library").classList.contains("show")) openVolume(vol ? vol.id : DATA.volumes[0].id, idx);
    else openLibrary();
  });
  document.getElementById("printBtn").addEventListener("click",function(){
    if(document.getElementById("library").classList.contains("show")) openVolume(DATA.volumes[0].id, 0);
    window.print();
  });
  document.addEventListener("keydown",function(e){
    if(document.getElementById("library").classList.contains("show")) return;
    if(e.key === "ArrowRight") step(1);
    if(e.key === "ArrowLeft") step(-1);
  });
  var sx = null, sy = null;
  book.addEventListener("touchstart",function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; },{passive:true});
  book.addEventListener("touchend",function(e){
    if(sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
    sx = null;
  },{passive:true});
  window.addEventListener("resize", setLayout);

  document.getElementById("footHosts").textContent = DATA.hosts + ", REALTORS® · " + DATA.brokerage;
  setLayout();
  var h = (location.hash || "").replace("#","");
  if(h === "library") { openVolume(DATA.volumes[0].id, 0); openLibrary(); }
  else { var parts = h.split("/"); openVolume(parts[0] || DATA.volumes[0].id, parseInt(parts[1],10) || 0); }
})();
</script>
</body>
</html>
